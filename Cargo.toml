# Workspace manifest for Docchain.
#
# List every crate in `members` explicitly, and only once it exists. A crate missing from the list is
# silently left out of every `--workspace` command, including the quality gate. A glob such as
# "crates/*" is not a shortcut: Cargo rejects a glob that matches no directory.

[workspace]
members = [
    "crates/docchain-domain",
    "crates/docchain-application",
    "apps/docchain-server",
]
# Set explicitly: a virtual manifest does not take its resolver from the edition.
resolver = "3"

# Members opt in with `edition.workspace = true`, `license.workspace = true`, and
# `publish.workspace = true`. A member that omits a key does not inherit it.
[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
# No crate is published.
publish = false
# No MSRV is promised; rust-toolchain.toml pins the toolchain used to build.

# One exact version per dependency. Members use it with `name.workspace = true`.
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-consensus = { version = "=2.1.0", default-features = false, features = ["std"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["migrate", "postgres", "runtime-tokio", "tls-none"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

# Members opt in with `[lints] workspace = true`. A member without that section gets no lint policy.
# Warnings are denied on the command line, never with `#![deny(warnings)]`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
