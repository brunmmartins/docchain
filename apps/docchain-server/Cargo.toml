[package]
name = "docchain-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-support = []

[dependencies]
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
docchain-application = { path = "../../crates/docchain-application" }
docchain-domain = { path = "../../crates/docchain-domain" }
ed25519-consensus.workspace = true
